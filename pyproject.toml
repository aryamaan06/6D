[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sixd-research-audit"
version = "0.2.0"
description = "A bounded, reproducible numerical audit prototype for 6D"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sixd = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*.woff2", "web/fonts/*.txt", "web/fonts/*.json"]

[project.scripts]
sixd = "sixd.cli:main"
